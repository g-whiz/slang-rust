name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

# The version of the Vulkan SDK that every job except vendored installs, and the SHA-256 checksums of
# its downloads. They change together, in the change that moves the Slang that slang-src records.
env:
  VULKAN_SDK_VERSION: 1.4.363.1
  VULKAN_SDK_SHA256_LINUX: b7867d8ca658563813af666f34b93db87f1b1c7d9d69d97e924c210c7ba33eb8
  VULKAN_SDK_SHA256_MACOS: a65c707cf0a32bf8c2ca6b9af1985b7af61dbadfc19b352dae51a323f3a547a6
  VULKAN_SDK_SHA256_WINDOWS: c02932bd9a968b22d404536108adaacac908c081cd6b0113f5bfefc523dd0a6a

jobs:
  check:
    name: Run every check on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - &checkout
        name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the stable and nightly Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup toolchain install nightly --profile minimal --component miri,rust-src --allow-downgrade
      - name: Install the check tools
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,shellcheck,typos,taplo,cargo-machete,cargo-deny,cargo-nextest
          fallback: none
      - &install-libclang
        name: Make libclang available, which the build script of slang-compiler-sys loads to generate the Slang bindings
        run: |
          case "${RUNNER_OS}" in
            Linux)
              sudo apt-get update
              sudo apt-get install --yes --no-install-recommends libclang-dev
              exit 0
              ;;
            Windows)
              directory='C:\Program Files\LLVM\bin'
              found="$(cygpath --unix "${directory}")/libclang.dll"
              ;;
            macOS)
              directory="$(xcode-select --print-path)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
              if [[ ! -f "${directory}/libclang.dylib" ]]; then
                directory=/Library/Developer/CommandLineTools/usr/lib
              fi
              found="${directory}/libclang.dylib"
              ;;
            *)
              printf '::error::No libclang is known for the runner OS %s\n' "${RUNNER_OS}"
              exit 1
              ;;
          esac
          if [[ ! -f "${found}" ]]; then
            printf '::error::The runner image provides no libclang at %s, which every build of slang-compiler-sys needs to generate the Slang bindings\n' "${found}"
            exit 1
          fi
          printf 'libclang: %s\n' "${found}"
          printf 'LIBCLANG_PATH=%s\n' "${directory}" >>"${GITHUB_ENV}"
      - &install-vulkan-sdk
        name: Install the Vulkan SDK
        env:
          SDK_SHA256: ${{ runner.os == 'Linux' && env.VULKAN_SDK_SHA256_LINUX || runner.os == 'macOS' && env.VULKAN_SDK_SHA256_MACOS || runner.os == 'Windows' && env.VULKAN_SDK_SHA256_WINDOWS || '' }}
        run: just install-vulkan-sdk "${VULKAN_SDK_VERSION}" "${SDK_SHA256}"
      - &check-vulkan-sdk
        name: Check the Slang of the Vulkan SDK
        run: just check-vulkan-sdk
      - name: Install actionlint
        run: |
          set -euo pipefail
          curl_https=(curl --fail --silent --show-error --proto '=https' --tlsv1.2)
          latest="$("${curl_https[@]}" --output /dev/null --write-out '%{redirect_url}' https://github.com/rhysd/actionlint/releases/latest)"
          version="${latest##*/v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Cannot read the latest actionlint version from "%s"\n' "${latest}" >&2
            exit 1
          fi
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          archive="actionlint_${version}_linux_amd64.tar.gz"
          work="$(mktemp -d)"
          "${curl_https[@]}" --location --output "${work}/${archive}" "${base}/${archive}"
          "${curl_https[@]}" --location --output "${work}/checksums.txt" "${base}/actionlint_${version}_checksums.txt"
          (cd "${work}" && awk -v name="${archive}" '$2 == name' checksums.txt | sha256sum --check --strict -)
          tar -xzf "${work}/${archive}" -C "${work}" actionlint
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "${work}/actionlint" "${HOME}/.local/bin/actionlint"
          printf '%s\n' "${HOME}/.local/bin" >>"${GITHUB_PATH}"
      - &install-lavapipe
        name: Install lavapipe as the software Vulkan adapter for the tests of the GPU tier
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers
      - &install-fontconfig
        name: Install the development files of fontconfig, which Slint links
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libfontconfig-dev
      - name: Run just check
        run: just check

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - *checkout
      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Install just and cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-nextest
          fallback: none
      - *install-libclang
      - *install-vulkan-sdk
      - *check-vulkan-sdk
      - name: Run Clippy
        run: just check-clippy
      - name: Run the doctests
        run: just check-doctest
      - name: Run the tests of the default and GPU tiers
        run: just test-gpu

  ci-only:
    name: Run ${{ matrix.recipe }} on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        recipe: [check-features, check-msrv]
    steps:
      - *checkout
      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install just and cargo-hack
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-hack
          fallback: none
      - *install-libclang
      - *install-vulkan-sdk
      - *check-vulkan-sdk
      - *install-fontconfig
      - name: Run the recipe
        env:
          RECIPE: ${{ matrix.recipe }}
        run: just "${RECIPE}"

  semver:
    name: Check for breaking changes on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - *checkout
      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Install just and cargo-semver-checks
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-semver-checks
          fallback: none
      - *install-libclang
      - *install-vulkan-sdk
      - *check-vulkan-sdk
      - name: Check for breaking changes against the last release
        run: just check-semver

  coverage:
    name: Measure test coverage on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - *checkout
      - name: Install the stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,llvm-tools
      - name: Install just, cargo-nextest, and cargo-llvm-cov
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-nextest,cargo-llvm-cov
          fallback: none
      - *install-libclang
      - *install-vulkan-sdk
      - *check-vulkan-sdk
      - *install-lavapipe
      - *install-fontconfig
      - name: Write the coverage report
        run: just coverage
      - name: Keep the coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: target/lcov.info
          if-no-files-found: error
          retention-days: 14

  vendored:
    name: Test the vendored build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - *checkout
      - name: Install the stable Rust toolchain
        env:
          COMPONENTS: ${{ matrix.os == 'ubuntu-latest' && 'clippy' || '' }}
        run: |
          if [[ -n "${COMPONENTS}" ]]; then
            rustup toolchain install stable --profile minimal --component "${COMPONENTS}"
          else
            rustup toolchain install stable --profile minimal
          fi
      - name: Install just and cargo-nextest
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just,cargo-nextest
          fallback: none
      - name: Show the version of git, which clones Slang
        run: git --version
      - *install-libclang
      - name: Install CMake, Ninja, a C++ compiler, Python 3, and the development files of fontconfig, which Slint links, where the runner image lacks them
        if: runner.os == 'Linux'
        run: |
          missing=()
          for tool in cmake:cmake ninja:ninja-build c++:g++ python3:python3 pkg-config:pkg-config; do
            if ! command -v "${tool%%:*}" >/dev/null; then
              missing+=("${tool#*:}")
            fi
          done
          if ! pkg-config --exists fontconfig 2>/dev/null; then
            missing+=(libfontconfig-dev)
          fi
          if [[ "${#missing[@]}" -ne 0 ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends "${missing[@]}"
          fi
      - name: Show the versions of CMake and Ninja, and of the C++ compiler outside Windows, where the build script finds the Microsoft compiler itself
        run: |
          cmake --version
          ninja --version
          if [[ "${RUNNER_OS}" != Windows ]]; then
            c++ --version
          fi
      - name: Show the Python 3 that the build of slang-glslang runs, and stop when the runner image has none
        run: |
          for program in python3 python; do
            if command -v "${program}" >/dev/null && "${program}" -c 'import sys; sys.exit(sys.version_info[0] != 3)' 2>/dev/null; then
              printf '%s: ' "$(command -v "${program}")"
              "${program}" --version
              exit 0
            fi
          done
          printf '::error::The runner image provides no Python 3 as python3 or python on PATH, which the build of slang-glslang needs, because SPIRV-Tools generates some of its sources with a Python script\n'
          exit 1
      - name: Install the development headers of Xlib, which the build of slang-rhi includes, and lavapipe and the Vulkan loader, which the tests of slang-rhi-sys use, where the runner image lacks them
        if: matrix.os == 'ubuntu-latest'
        run: |
          missing=()
          for package in libx11-dev mesa-vulkan-drivers libvulkan1; do
            if ! dpkg-query --show --showformat='${db:Status-Status}' "${package}" 2>/dev/null | grep -qx installed; then
              missing+=("${package}")
            fi
          done
          if [[ "${#missing[@]}" -ne 0 ]]; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends "${missing[@]}"
          fi
      - name: Run Clippy and the documentation build of the vendored build, and show how long it took
        if: matrix.os == 'ubuntu-latest'
        run: time just check-vendored
      - name: Run Clippy and the documentation build of slang-rhi-sys, and show how long it took
        if: matrix.os == 'ubuntu-latest'
        run: time just check-rhi
      - name: Run the tests of the vendored build, and show how long it took
        run: time just test-vendored
      - name: Run the tests of slang-rhi-sys, and show how long it took
        if: matrix.os == 'ubuntu-latest'
        run: time just test-rhi
      - name: Check where the vendored build kept its Slang clone
        run: just check-vendored-shared-folder
