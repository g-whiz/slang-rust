[package]
name = "slang-compiler"
description = "Safe Rust wrappers over the Slang shader compiler."
keywords = ["slang", "shader", "compiler", "spirv", "gpu"]
categories = ["api-bindings", "graphics", "compilers"]
documentation = "https://g-whiz.github.io/slang-rust/slang_compiler/"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
vendored = ["slang-compiler-sys/vendored", "dep:slang-glslang-sys"]

[dependencies]
slang-compiler-sys.workspace = true
slang-glslang-sys = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true
