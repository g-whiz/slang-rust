[package]
name = "slang-rhi"
description = "Safe Rust wrappers over slang-rhi, the render hardware interface of Slang, for compute dispatches."
keywords = ["slang", "rhi", "vulkan", "gpu", "compute"]
categories = ["api-bindings", "graphics"]
publish = false
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bitflags.workspace = true
slang-rhi-sys.workspace = true

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
slang-compiler = { workspace = true, features = ["vendored"] }
slang-compiler-sys.workspace = true

[lints]
workspace = true
