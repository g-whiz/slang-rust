[package]
name = "slang-slint"
description = "Show what a Slang render pipeline of slango draws inside a Slint user interface."
keywords = ["slang", "shader", "slint", "wgpu", "gui"]
categories = ["graphics", "gui", "rendering"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
readme.workspace = true

[features]
vendored = ["slango/vendored"]

[dependencies]
slango = { workspace = true, features = ["wgpu"] }
slint = { workspace = true, features = [
    "compat-1-18",
    "std",
    "unstable-wgpu-30",
] }

[lints]
workspace = true
