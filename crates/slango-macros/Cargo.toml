[package]
name = "slango-macros"
description = "The procedural macro shader!, which compiles a Slang file while a crate builds and generates typed Rust bindings to its compute kernels, for slango."
keywords = ["slang", "shader", "gpu", "macro", "compute"]
categories = ["graphics", "development-tools::procedural-macro-helpers"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[lib]
proc-macro = true

[dependencies]
slango-codegen.workspace = true
syn = { workspace = true, features = ["parsing", "printing", "proc-macro"] }

[dev-dependencies]
slango.workspace = true
trybuild.workspace = true

[lints]
workspace = true
