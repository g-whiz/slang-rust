[package]
name = "slango-macros"
description = "The procedural macro shader!, which compiles a Slang file while a crate builds and generates typed Rust bindings to its compute kernels, for slango."
keywords = ["slang", "shader", "gpu", "macro", "compute"]
categories = ["graphics", "development-tools::procedural-macro-helpers"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
proc-macro = true

[features]
vendored = ["slango-codegen/vendored"]

[dependencies]
slango-codegen.workspace = true
syn = { workspace = true, features = ["parsing", "printing", "proc-macro"] }

[dev-dependencies]
slango = { workspace = true, features = ["wgpu"] }
trybuild.workspace = true

[lints]
workspace = true
