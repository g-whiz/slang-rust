[package]
name = "slango"
description = "Run Slang compute kernels and draw with Slang render pipelines on the GPU from Rust, through wgpu."
keywords = ["slang", "shader", "gpu", "wgpu", "compute"]
categories = ["graphics", "rendering::graphics-api"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
default = ["wgpu"]
vendored = ["slang-compiler/vendored"]
wgpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
pollster = { workspace = true, optional = true }
slang-compiler.workspace = true
wgpu = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true
