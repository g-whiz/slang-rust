[package]
name = "slang-compiler-sys"
description = "Raw bindings to the Slang shader compiler, generated from the Slang headers in every build."
keywords = ["slang", "shader", "ffi", "bindings", "gpu"]
categories = ["external-ffi-bindings", "graphics"]
links = "slang-compiler"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 WITH LLVM-exception"
repository.workspace = true
readme.workspace = true

[features]
vendored = ["dep:slang-src", "dep:find-msvc-tools"]

[dependencies]
slang-src = { workspace = true, optional = true }

[build-dependencies]
find-msvc-tools = { workspace = true, optional = true }
slang-bindgen.workspace = true

[dev-dependencies]
find-msvc-tools.workspace = true
slang-bindgen.workspace = true

[lints]
workspace = true
