[package]
name = "slang-rhi-sys"
description = "slang-rhi, the render hardware interface of Slang, built statically from the Slang source tree with the vendored Slang."
keywords = ["slang", "rhi", "vulkan", "gpu", "ffi"]
categories = ["external-ffi-bindings", "graphics"]
links = "slang-rhi"
publish = false
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0 WITH LLVM-exception"
repository.workspace = true
readme = "README.md"

[target.'cfg(any(all(target_os = "linux", target_env = "gnu"), all(target_os = "windows", target_env = "msvc", target_arch = "x86_64")))'.dependencies]
slang-compiler-sys = { workspace = true, features = ["vendored"] }
slang-src.workspace = true

[build-dependencies]
find-msvc-tools.workspace = true
slang-bindgen.workspace = true

[dev-dependencies]
find-msvc-tools.workspace = true
slang-bindgen.workspace = true

[lints]
workspace = true
