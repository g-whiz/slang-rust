[package]
name = "slango-codegen"
description = "The generator of slango-macros: typed Rust bindings to the compute kernels of a Slang file, for slango."
keywords = ["slang", "shader", "gpu", "codegen", "compute"]
categories = ["graphics", "development-tools::procedural-macro-helpers"]
documentation = "https://g-whiz.github.io/slang-rust/slango_codegen/"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
vendored = ["slango/vendored"]

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
# The exact version keeps the hidden module and the encoded snapshot of slango
# that the generated code uses in step with this crate.
slango = { path = "../slango", version = "=0.2.0-alpha.1", features = ["wgpu"] }

[dev-dependencies]
insta.workspace = true
prettyplease.workspace = true
syn = { workspace = true, features = ["full", "parsing", "printing"] }

[lints]
workspace = true
