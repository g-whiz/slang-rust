[package]
name = "slango-codegen"
description = "The generator of slango-macros: typed Rust bindings to the compute kernels of a Slang file, for slango."
keywords = ["slang", "shader", "gpu", "codegen", "compute"]
categories = ["graphics", "development-tools::procedural-macro-helpers"]
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
# The exact version keeps the hidden module and the encoded snapshot of slango
# that the generated code uses in step with this crate (SLM-2).
slango = { path = "../slango", version = "=0.1.0" }

[dev-dependencies]
insta.workspace = true
prettyplease.workspace = true
syn = { workspace = true, features = ["full", "parsing", "printing"] }

[lints]
workspace = true
