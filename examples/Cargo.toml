[package]
name = "slang-rust-examples"
description = "Runnable examples of the slang-rust crates."
publish = false
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[features]
vendored = [
    "slang-compiler/vendored",
    "slang-slint/vendored",
    "slango/vendored",
    "slango-macros/vendored",
]

[dependencies]
pollster.workspace = true
slang-compiler.workspace = true
slang-slint.workspace = true
slango = { workspace = true, features = ["wgpu"] }
slango-macros.workspace = true
slint = { workspace = true, features = [
    "backend-winit",
    "compat-1-18",
    "renderer-femtovg-wgpu",
    "std",
    "unstable-wgpu-30",
] }
wgpu.workspace = true
winit.workspace = true

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true
