[workspace]
resolver = "3"
members = [
    "crates/slang-compiler",
    "crates/slang-compiler-sys",
    "examples",
    "tools/bindings-generator",
]

[workspace.package]
authors = ["George Gianacopoulos <gpg.software@gmail.com>"]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/g-whiz/slang-rust"
readme = "README.md"

[workspace.dependencies]
clang = { version = "2.1.0", features = ["runtime", "clang_10_0"] }
insta = { version = "1.49.0", default-features = false }
slang-compiler = { path = "crates/slang-compiler", version = "0.1.0" }
slang-compiler-sys = { path = "crates/slang-compiler-sys", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unnameable_types = "warn"
elided_lifetimes_in_paths = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_qualifications = "warn"
let_underscore_drop = "warn"
macro_use_extern_crate = "warn"
ffi_unwind_calls = "warn"
ambiguous_negative_literals = "warn"
redundant_imports = "warn"

[workspace.lints.rustdoc]
all = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"

unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
map_err_ignore = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"

undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
mem_forget = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

exhaustive_enums = "warn"
exhaustive_structs = "warn"
partial_pub_fields = "warn"
mod_module_files = "warn"
