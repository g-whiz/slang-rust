[workspace]
resolver = "3"
members = [
    "crates/slang-sys",
]

[workspace.package]
authors = ["George Gianacopoulos <gpg.software@gmail.com>"]
version = "0.1.0"
edition = "2024"


[workspace.dependencies]
bindgen = { version = "0.72.1" }
cmake = { version = "0.1.57" }

[workspace.metadata]
# version tag for the underlying slang library
slang-version = "v2026.1.2"
