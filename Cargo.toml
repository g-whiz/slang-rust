[workspace]
resolver = "3"
members = [
    "crates/slang-bindgen",
    "crates/slang-compiler",
    "crates/slang-compiler-sys",
    "crates/slang-glslang-sys",
    "crates/slang-rhi-sys",
    "crates/slang-slint",
    "crates/slang-src",
    "crates/slango",
    "crates/slango-codegen",
    "crates/slango-macros",
    "examples",
]
default-members = [
    "crates/slang-bindgen",
    "crates/slang-compiler",
    "crates/slang-compiler-sys",
    "crates/slang-slint",
    "crates/slango",
    "crates/slango-codegen",
    "crates/slango-macros",
    "examples",
]

[workspace.package]
authors = ["George Gianacopoulos <gpg.software@gmail.com>"]
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/g-whiz/slang-rust"

[workspace.dependencies]
clang = { version = "2.1.0", features = ["runtime", "clang_10_0"] }
clang-sys = { version = "1.9.1", features = ["runtime", "clang_10_0"] }
find-msvc-tools = "0.1.15"
insta = { version = "1.49.0", default-features = false }
pollster = "0.4.0"
prettyplease = "0.2.37"
proc-macro2 = "1.0.107"
quote = "1.0.47"
slang-bindgen = { path = "crates/slang-bindgen", version = "=0.1.0-alpha.2" }
slang-compiler = { path = "crates/slang-compiler", version = "=0.1.0-alpha.2" }
slang-compiler-sys = { path = "crates/slang-compiler-sys", version = "=0.1.0-alpha.2" }
slang-glslang-sys = { path = "crates/slang-glslang-sys", version = "=0.1.0-alpha.2" }
slang-slint = { path = "crates/slang-slint", version = "=0.1.0-alpha.2" }
slang-src = { path = "crates/slang-src", version = "=0.1.0-alpha.2.slang.2026.17.0.25.gc7954ebd1" }
slango = { path = "crates/slango", version = "=0.1.0-alpha.2" }
slango-codegen = { path = "crates/slango-codegen", version = "=0.1.0-alpha.2" }
slango-macros = { path = "crates/slango-macros", version = "=0.1.0-alpha.2" }
slint = { version = "~1.18", default-features = false }
syn = { version = "2.0.119", default-features = false }
trybuild = "1.0.122"
wgpu = { version = "30.0.1", features = ["spirv"] }
winit = { version = "0.30.13", default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
] }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unnameable_types = "warn"
elided_lifetimes_in_paths = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_qualifications = "warn"
let_underscore_drop = "warn"
macro_use_extern_crate = "warn"
ffi_unwind_calls = "warn"
ambiguous_negative_literals = "warn"
redundant_imports = "warn"

[workspace.lints.rustdoc]
all = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"

unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
map_err_ignore = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"

undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
mem_forget = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

exhaustive_enums = "warn"
exhaustive_structs = "warn"
partial_pub_fields = "warn"
mod_module_files = "warn"
